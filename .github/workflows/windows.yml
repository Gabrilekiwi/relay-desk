name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Test network settings and account controls
        run: python -B -m unittest discover -s tests -v
      - name: Build the Windows preview
        shell: pwsh
        run: |
          ./Build.ps1
          if (-not (Test-Path -LiteralPath 'dist/Relay Desk Preview.exe' -PathType Leaf)) {
            throw 'Build did not produce the Windows executable.'
          }
